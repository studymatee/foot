<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>بطاقة اللاعب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #16a34a; --green-bright: #22c55e; --green-deep: #15803d; --green-light: #dcfce7;
  --red: #dc2626; --red-bright: #ef4444; --red-light: #fee2e2;
  --blue: #3b82f6; --blue-light: #dbeafe;
  --purple: #8b5cf6;
  --gold-1: #fde68a; --gold-2: #fbbf24; --gold-3: #d97706;
  --silver-1: #f1f5f9; --silver-2: #cbd5e1; --silver-3: #94a3b8;
  --bronze-1: #fed7aa; --bronze-2: #fb923c; --bronze-3: #c2410c;
  --bg: #f8fafc; --card: #ffffff; --text: #0f172a;
  --text-muted: #64748b; --border: #e2e8f0;
}
body {
  font-family: 'Cairo', system-ui, sans-serif; color: var(--text);
  background: var(--bg); min-height: 100vh; padding: 20px;
  direction: rtl; position: relative; overflow-x: hidden;
}
body::before, body::after {
  content: ""; position: fixed; border-radius: 50%;
  filter: blur(120px); z-index: 0; pointer-events: none;
}
body::before {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(34,197,94,0.25), transparent 70%);
  top: -150px; right: -150px;
}
body::after {
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(139,92,246,0.2), transparent 70%);
  bottom: -200px; left: -200px;
}
.grid-bg {
  position: fixed; inset: 0;
  background-image: linear-gradient(rgba(22,163,74,0.06) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(22,163,74,0.06) 1px, transparent 1px);
  background-size: 45px 45px; z-index: 0; pointer-events: none;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
}
.container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }

.header {
  background: rgba(255,255,255,0.85);
  border: 1px solid var(--border);
  backdrop-filter: blur(20px);
  border-radius: 24px; padding: 18px 22px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px; flex-wrap: wrap; gap: 14px;
  box-shadow: 0 10px 40px rgba(15,23,42,0.08);
}
.logo { display: flex; align-items: center; gap: 14px; }
.logo-icon {
  width: 52px; height: 52px; border-radius: 16px;
  background: linear-gradient(135deg, var(--green-bright), var(--green-deep));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px rgba(22,163,74,0.4);
}
.logo-icon svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.logo-text h1 {
  font-size: 1.3rem; font-weight: 900;
  background: linear-gradient(135deg, var(--green), var(--green-deep));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.logo-text p { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 18px; border-radius: 14px;
  font-weight: 700; font-size: 0.85rem; cursor: pointer; border: none;
  transition: all 0.25s; text-decoration: none; font-family: inherit;
}
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.btn-white { background: #fff; color: var(--text); border: 1px solid var(--border); box-shadow: 0 4px 12px rgba(15,23,42,0.05); }
.btn-white:hover { transform: translateY(-2px); background: var(--green-light); }
.btn-green { background: linear-gradient(135deg, var(--green-bright), var(--green-deep)); color: #fff; box-shadow: 0 4px 12px rgba(22,163,74,0.35); }
.btn-green:hover { transform: translateY(-2px); }
.btn-share { background: linear-gradient(135deg, #25d366, #128c7e); color: #fff; box-shadow: 0 4px 12px rgba(37,211,102,0.35); }
.btn-share:hover { transform: translateY(-2px); }
.btn-gold { background: linear-gradient(135deg, #fbbf24, #d97706); color: #fff; box-shadow: 0 4px 12px rgba(245,158,11,0.35); }
.btn-gold:hover { transform: translateY(-2px); }

.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 24px; padding: 24px; margin-bottom: 22px;
  box-shadow: 0 8px 32px rgba(15,23,42,0.06);
}
.card h2 {
  font-size: 1.1rem; margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px; font-weight: 800;
}
.card h2 svg { width: 20px; height: 20px; stroke: var(--green); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.loading { text-align: center; padding: 60px 20px; color: var(--text-muted); font-weight: 600; }
.spinner {
  width: 44px; height: 44px; border-radius: 50%;
  border: 4px solid rgba(22,163,74,0.2);
  border-top-color: var(--green);
  animation: spin 0.8s linear infinite; margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty {
  text-align: center; padding: 60px 20px;
  background: var(--card); border-radius: 28px;
  border: 2px dashed var(--border);
}
.empty svg { width: 60px; height: 60px; stroke: var(--purple); fill: none; stroke-width: 1.5; margin-bottom: 16px; }
.empty h2 { font-size: 1.3rem; margin-bottom: 10px; }
.empty p { color: var(--text-muted); font-weight: 600; margin-bottom: 20px; }

/* =============== FIFA CARD =============== */
.fifa-scene {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px 0;
  perspective: 1200px;
}

.fifa-card {
  width: 320px;
  height: 460px;
  border-radius: 28px;
  position: relative;
  padding: 22px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: transform 0.4s cubic-bezier(.4,0,.2,1), box-shadow 0.4s;
  transform-style: preserve-3d;
  cursor: pointer;
  box-shadow: 0 25px 60px rgba(0,0,0,0.25);
}

.fifa-card:hover {
  transform: rotateY(8deg) rotateX(-6deg) scale(1.03);
  box-shadow: 0 35px 80px rgba(0,0,0,0.35);
}

/* Gold Card */
.fifa-card.gold {
  background: linear-gradient(160deg, #fef9c3 0%, #fde68a 15%, #fbbf24 45%, #d97706 75%, #b45309 100%);
  border: 3px solid #fde68a;
  box-shadow: 0 25px 60px rgba(217,119,6,0.5), inset 0 0 0 2px rgba(255,255,255,0.4);
}
.fifa-card.gold::before {
  background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.6), transparent 50%),
              radial-gradient(circle at 80% 80%, rgba(255,200,50,0.5), transparent 60%);
}
.fifa-card.gold .fifa-name,
.fifa-card.gold .fifa-rating { color: #422006; text-shadow: 0 2px 4px rgba(255,255,255,0.5); }
.fifa-card.gold .fifa-position { background: rgba(180,83,9,0.95); color: #fff; }
.fifa-card.gold .fifa-stat-label,
.fifa-card.gold .fifa-stat-value { color: #422006; }
.fifa-card.gold .fifa-team { color: #78350f; }

/* Silver Card */
.fifa-card.silver {
  background: linear-gradient(160deg, #f8fafc 0%, #e2e8f0 25%, #cbd5e1 55%, #94a3b8 80%, #64748b 100%);
  border: 3px solid #f1f5f9;
  box-shadow: 0 25px 60px rgba(100,116,139,0.5), inset 0 0 0 2px rgba(255,255,255,0.5);
}
.fifa-card.silver::before {
  background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.8), transparent 50%),
              radial-gradient(circle at 80% 80%, rgba(148,163,184,0.4), transparent 60%);
}
.fifa-card.silver .fifa-name,
.fifa-card.silver .fifa-rating { color: #1e293b; text-shadow: 0 2px 4px rgba(255,255,255,0.7); }
.fifa-card.silver .fifa-position { background: rgba(71,85,105,0.95); color: #fff; }
.fifa-card.silver .fifa-stat-label,
.fifa-card.silver .fifa-stat-value { color: #1e293b; }
.fifa-card.silver .fifa-team { color: #475569; }

/* Bronze Card */
.fifa-card.bronze {
  background: linear-gradient(160deg, #fed7aa 0%, #fb923c 25%, #ea580c 55%, #c2410c 80%, #7c2d12 100%);
  border: 3px solid #fed7aa;
  box-shadow: 0 25px 60px rgba(194,65,12,0.5), inset 0 0 0 2px rgba(255,255,255,0.3);
}
.fifa-card.bronze::before {
  background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.5), transparent 50%),
              radial-gradient(circle at 80% 80%, rgba(251,146,60,0.5), transparent 60%);
}
.fifa-card.bronze .fifa-name,
.fifa-card.bronze .fifa-rating { color: #431407; text-shadow: 0 2px 4px rgba(255,255,255,0.3); }
.fifa-card.bronze .fifa-position { background: rgba(124,45,18,0.95); color: #fff; }
.fifa-card.bronze .fifa-stat-label,
.fifa-card.bronze .fifa-stat-value { color: #431407; }
.fifa-card.bronze .fifa-team { color: #7c2d12; }

/* Card decorative lights */
.fifa-card::before {
  content: "";
  position: absolute; inset: 0;
  border-radius: 25px;
  pointer-events: none;
  z-index: 1;
}

/* Shine effect on hover */
.fifa-card::after {
  content: "";
  position: absolute;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.5) 50%, transparent 60%);
  transform: translateX(-100%) rotate(0deg);
  transition: transform 0.8s;
  pointer-events: none;
  z-index: 2;
}
.fifa-card:hover::after {
  transform: translateX(100%) rotate(0deg);
}

/* Card Content */
.fifa-top {
  display: flex; align-items: flex-start; gap: 14px;
  position: relative; z-index: 3;
}

.fifa-rating-box {
  text-align: center;
  flex-shrink: 0;
}
.fifa-rating {
  font-size: 3rem;
  font-weight: 900;
  line-height: 1;
  margin-bottom: 4px;
}
.fifa-position {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 8px;
  font-size: 0.75rem;
  font-weight: 900;
  letter-spacing: 1px;
}
.fifa-flag {
  width: 32px; height: 22px;
  border-radius: 4px;
  margin-top: 10px;
  overflow: hidden;
  display: flex;
  border: 2px solid rgba(255,255,255,0.7);
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.fifa-flag span { flex: 1; }
.fifa-flag .g { background: #16a34a; }
.fifa-flag .w { background: #fff; }
.fifa-flag .r { background: #dc2626; }

.fifa-photo-wrap {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
  min-height: 130px;
}
.fifa-photo {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid rgba(255,255,255,0.9);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3), 0 0 40px rgba(255,255,255,0.2);
  background: #f1f5f9;
}
.fifa-photo-glow {
  position: absolute;
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.4), transparent 70%);
  animation: pulse 2.5s ease-in-out infinite;
  pointer-events: none;
}
@keyframes pulse {
  0%,100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.15); opacity: 0.3; }
}

/* Name */
.fifa-name-bar {
  margin-top: 16px;
  text-align: center;
  padding: 12px 0;
  border-top: 2px solid rgba(0,0,0,0.15);
  border-bottom: 2px solid rgba(0,0,0,0.15);
  position: relative;
  z-index: 3;
}
.fifa-name {
  font-size: 1.5rem;
  font-weight: 900;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.fifa-team {
  font-size: 0.75rem;
  font-weight: 700;
  opacity: 0.85;
}

/* Stats */
.fifa-stats {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 20px;
  margin-top: 14px;
  position: relative;
  z-index: 3;
  align-content: start;
}
.fifa-stat {
  display: flex;
  align-items: baseline;
  gap: 6px;
  font-size: 0.75rem;
  font-weight: 800;
}
.fifa-stat-value {
  font-size: 1.1rem;
  font-weight: 900;
  min-width: 28px;
}
.fifa-stat-label {
  opacity: 0.9;
}

/* Share section */
.share-section {
  text-align: center;
  padding: 16px 0;
}

/* Download button */
.download-hint {
  text-align: center;
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 12px;
  font-weight: 600;
}

@media (max-width: 480px) {
  body { padding: 12px; }
  .header { padding: 14px 16px; }
  .logo-text h1 { font-size: 1.1rem; }
  .card { padding: 18px; }
  .fifa-card { width: 280px; height: 420px; padding: 18px; }
  .fifa-rating { font-size: 2.5rem; }
  .fifa-photo { width: 90px; height: 90px; }
  .fifa-photo-glow { width: 110px; height: 110px; }
  .fifa-name { font-size: 1.25rem; }
  .fifa-stat-value { font-size: 1rem; }
}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="container">
  <header class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="10" r="3"/><path d="M6 21v-1a6 6 0 0 1 12 0v1"/></svg>
      </div>
      <div class="logo-text">
        <h1>بطاقة اللاعب</h1>
        <p>بطاقة على طريقة FIFA 🇩🇿</p>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a href="index.html" class="btn btn-white">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        الرئيسية
      </a>
      <a href="leaderboard.html" class="btn btn-white">
        <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        الترتيب
      </a>
    </div>
  </header>

  <div id="content">
    <div class="loading"><div class="spinner"></div>جاري التحميل...</div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ncrycgbrstafdouvipzc.supabase.co";
const SUPABASE_KEY = "sb_publishable_6t2dkU27Rkinsoo8MhYAEQ_FSgj4G73";

// نقرأ id اللاعب من الرابط
const params = new URLSearchParams(window.location.search);
const playerId = params.get("id");

function calcOverall(p) {
  return Math.round((p.strength + p.shot_power + p.pace + p.dribbling + p.passing + p.defense) / 6);
}

function getCardTier(overall) {
  if (overall >= 85) return "gold";
  if (overall >= 70) return "silver";
  return "bronze";
}

function defaultPhoto() {
  return 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23cbd5e1"><circle cx="12" cy="8" r="4"/><path d="M4 22c0-4 4-7 8-7s8 3 8 7" fill="none" stroke="%2364748b" stroke-width="1.5"/></svg>';
}

function escapeHTML(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

async function loadPlayer() {
  const content = document.getElementById("content");

  if (!playerId) {
    content.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <h2>ما فيه لاعب محدد</h2>
        <p>اختار لاعب من الصفحة الرئيسية</p>
        <a href="index.html" class="btn btn-green">
          <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          الرئيسية
        </a>
      </div>`;
    return;
  }

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/players?id=eq.${playerId}&select=*`, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    });
    const data = await res.json();
    if (!data || data.length === 0) {
      content.innerHTML = `
        <div class="empty">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          <h2>ما لقيناش اللاعب</h2>
          <p>يمكن تحيّد ولا الرابط غالط</p>
          <a href="index.html" class="btn btn-green">الرئيسية</a>
        </div>`;
      return;
    }
    renderCard(data[0]);
  } catch (e) {
    content.innerHTML = `<div class="loading">خطأ: ${e.message}</div>`;
  }
}

function renderCard(p) {
  const overall = calcOverall(p);
  const tier = getCardTier(overall);
  const photo = p.photo || defaultPhoto();

  const STAT_LABELS = {
    pace: "السرعة",
    shot_power: "الفراب",
    passing: "التمرير",
    dribbling: "المراوغة",
    defense: "الدفاع",
    strength: "القوة"
  };

  const statsHTML = Object.keys(STAT_LABELS).map(key => `
    <div class="fifa-stat">
      <span class="fifa-stat-value">${p[key] || 0}</span>
      <span class="fifa-stat-label">${STAT_LABELS[key]}</span>
    </div>
  `).join("");

  document.getElementById("content").innerHTML = `
    <div class="fifa-scene">
      <div class="fifa-card ${tier}" id="fifaCard">
        <div class="fifa-top">
          <div class="fifa-rating-box">
            <div class="fifa-rating">${overall}</div>
            <div class="fifa-position">${p.position}</div>
            <div class="fifa-flag">
              <span class="g"></span>
              <span class="w"></span>
              <span class="r"></span>
            </div>
          </div>
          <div class="fifa-photo-wrap">
            <div class="fifa-photo-glow"></div>
            <img class="fifa-photo" src="${photo}" alt="${escapeHTML(p.name)}" onerror="this.src='${defaultPhoto()}'" crossorigin="anonymous" />
          </div>
        </div>

        <div class="fifa-name-bar">
          <div class="fifa-name">${escapeHTML(p.name)}</div>
          <div class="fifa-team">🇩🇿 الحومة</div>
        </div>

        <div class="fifa-stats">${statsHTML}</div>
      </div>
    </div>

    <div class="card">
      <div class="share-section">
        <button class="btn btn-share" onclick="shareWhatsApp()" style="padding:14px 28px;font-size:1rem">
          <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          شارك على واتساب
        </button>
        <button class="btn btn-gold" onclick="downloadCard()" style="padding:14px 28px;font-size:1rem;margin-right:8px">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          حمّل الصورة
        </button>
        <p class="download-hint">📱 تنجم تشارك البطاقة مع صحابك على واتساب</p>
      </div>
    </div>
  `;

  // نخزنو اسم اللاعب باش يخدم participage
  window._playerName = p.name;
  window._playerId = p.id;
}

// ==== Share WhatsApp ====
window.shareWhatsApp = function() {
  const url = window.location.href;
  const name = window._playerName || "لاعب";
  const text = `🔥 شوف بطاقة ${name} في كرة الحومة 🇩🇿:\n${url}`;
  const whatsappURL = `https://wa.me/?text=${encodeURIComponent(text)}`;
  window.open(whatsappURL, "_blank");
};

// ==== Download as image ====
window.downloadCard = async function() {
  try {
    // نستخدم html2canvas عبر CDN
    if (typeof html2canvas === "undefined") {
      await loadScript("https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js");
    }

    const card = document.getElementById("fifaCard");

    // نحفظو الخصائص مؤقتاً
    const originalTransform = card.style.transform;
    const originalBoxShadow = card.style.boxShadow;
    card.style.transform = "none";
    card.style.boxShadow = "0 25px 60px rgba(0,0,0,0.25)";

    const canvas = await html2canvas(card, {
      backgroundColor: null,
      scale: 2,
      useCORS: true,
      allowTaint: false,
      logging: false
    });

    // نرجعو الخصائص
    card.style.transform = originalTransform;
    card.style.boxShadow = originalBoxShadow;

    // نحمّلو الصورة
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `card-${window._playerName || "player"}.png`;
      a.click();
      URL.revokeObjectURL(url);
    }, "image/png", 1);
  } catch (e) {
    alert("ما قدرناش نحمّلو الصورة: " + e.message);
  }
};

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

loadPlayer();
</script>
</body>
</html>
