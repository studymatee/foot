<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>إدارة اللاعبين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #10b981; --green-bright: #34d399; --green-deep: #064e3b;
  --red: #ef4444; --red-bright: #f87171;
  --bg-1: #041a10; --bg-2: #062b1a;
}
html, body { height: 100%; }
body {
  font-family: 'Cairo', system-ui, sans-serif;
  color: #fff; background: var(--bg-1);
  min-height: 100vh; padding: 20px; direction: rtl;
  overflow-x: hidden; position: relative;
}
body::before, body::after {
  content: ""; position: fixed; border-radius: 50%;
  filter: blur(120px); z-index: -1; pointer-events: none;
}
body::before {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(239,68,68,0.4), transparent 70%);
  top: -150px; right: -150px;
  animation: float1 14s ease-in-out infinite;
}
body::after {
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(16,185,129,0.45), transparent 70%);
  bottom: -200px; left: -200px;
  animation: float2 18s ease-in-out infinite;
}
@keyframes float1 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-60px,60px) scale(1.15);} }
@keyframes float2 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(80px,-60px) scale(1.1);} }
.grid-bg {
  position: fixed; inset: 0;
  background-image: linear-gradient(rgba(52,211,153,0.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(52,211,153,0.05) 1px, transparent 1px);
  background-size: 45px 45px; z-index: -1; pointer-events: none;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
}
.container { max-width: 900px; margin: 0 auto; position: relative; }

.header {
  background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
  border: 1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 24px; padding: 18px 22px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px; flex-wrap: wrap; gap: 14px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
}
.logo { display: flex; align-items: center; gap: 14px; }
.logo-icon {
  width: 52px; height: 52px; border-radius: 16px;
  background: linear-gradient(135deg, var(--red), #b91c1c);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px rgba(239,68,68,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
}
.logo-icon svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.logo-text h1 {
  font-size: 1.3rem; font-weight: 900;
  background: linear-gradient(135deg, #fff, var(--red-bright));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.logo-text p { font-size: 0.75rem; color: rgba(255,255,255,0.55); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 20px; border-radius: 14px;
  font-weight: 700; font-size: 0.9rem; cursor: pointer; border: none;
  transition: all 0.25s cubic-bezier(.4,0,.2,1);
  text-decoration: none; font-family: inherit;
}
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.btn-green { background: linear-gradient(135deg, var(--green), var(--green-deep)); color: #fff; box-shadow: 0 8px 24px rgba(16,185,129,0.45), inset 0 1px 0 rgba(255,255,255,0.25); }
.btn-green:hover { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(16,185,129,0.6); }
.btn-green:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.btn-red { background: linear-gradient(135deg, var(--red), #b91c1c); color: #fff; box-shadow: 0 8px 24px rgba(239,68,68,0.45), inset 0 1px 0 rgba(255,255,255,0.25); }
.btn-red:hover { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(239,68,68,0.6); }
.btn-white { background: rgba(255,255,255,0.95); color: var(--green-deep); box-shadow: 0 8px 24px rgba(255,255,255,0.15); }
.btn-white:hover { transform: translateY(-3px); background: #fff; }
.btn-small { padding: 7px 14px; font-size: 0.8rem; border-radius: 10px; }

.card {
  background: linear-gradient(160deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-radius: 24px; padding: 24px; margin-bottom: 22px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  position: relative; overflow: hidden;
}
.card h2 {
  font-size: 1.15rem; margin-bottom: 20px; color: #fff;
  display: flex; align-items: center; gap: 10px; font-weight: 800;
}
.card h2 svg { width: 22px; height: 22px; stroke: var(--green-bright); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.label { display: block; margin-bottom: 8px; font-size: 0.85rem; font-weight: 700; color: rgba(255,255,255,0.75); }
.input {
  width: 100%; padding: 12px 16px; border-radius: 14px;
  border: 2px solid rgba(255,255,255,0.1);
  background: rgba(0,0,0,0.3); color: #fff;
  font-size: 0.95rem; outline: none; transition: all 0.25s;
  font-family: inherit; backdrop-filter: blur(10px);
}
.input:focus { border-color: var(--green-bright); background: rgba(0,0,0,0.4); box-shadow: 0 0 0 4px rgba(52,211,153,0.15); }
.input::placeholder { color: rgba(255,255,255,0.35); }
select.input option { background: var(--bg-2); color: #fff; }

.form-group { margin-bottom: 18px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 600px) { .form-row { grid-template-columns: 1fr; gap: 0; } }

.slider-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; padding: 8px; border-radius: 12px; transition: background 0.2s; }
.slider-row:hover { background: rgba(255,255,255,0.04); }
.slider-label { width: 130px; font-size: 0.85rem; color: rgba(255,255,255,0.75); font-weight: 700; flex-shrink: 0; }

input[type="range"] {
  flex: 1; height: 6px; border-radius: 999px;
  background: rgba(0,0,0,0.5); outline: none;
  -webkit-appearance: none; appearance: none;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 22px; height: 22px; border-radius: 50%;
  background: linear-gradient(135deg, var(--green-bright), var(--green));
  cursor: pointer; border: 3px solid #fff;
  box-shadow: 0 4px 12px rgba(16,185,129,0.6), 0 0 20px rgba(52,211,153,0.4);
  transition: transform 0.2s;
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
input[type="range"]::-moz-range-thumb {
  width: 22px; height: 22px; border-radius: 50%;
  background: linear-gradient(135deg, var(--green-bright), var(--green));
  cursor: pointer; border: 3px solid #fff;
  box-shadow: 0 4px 12px rgba(16,185,129,0.6);
}

.slider-value {
  width: 48px; text-align: center; font-weight: 800;
  background: linear-gradient(135deg, rgba(16,185,129,0.25), rgba(16,185,129,0.1));
  border: 1px solid rgba(52,211,153,0.3);
  border-radius: 10px; padding: 5px; font-size: 0.85rem;
  color: var(--green-bright);
}

.photo-preview {
  width: 100px; height: 100px; border-radius: 20px; object-fit: cover;
  border: 3px solid var(--green-bright); background: var(--bg-2);
  margin-top: 12px; box-shadow: 0 8px 24px rgba(16,185,129,0.3);
}

.player-row {
  display: flex; align-items: center; gap: 14px; padding: 14px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px; margin-bottom: 10px; transition: all 0.25s;
}
.player-row:hover { background: rgba(255,255,255,0.08); border-color: rgba(52,211,153,0.3); transform: translateX(-4px); }
.player-row img {
  width: 52px; height: 52px; border-radius: 14px; object-fit: cover;
  border: 2px solid var(--green-bright); background: var(--bg-2);
}
.player-row .info { flex: 1; }
.player-row .info strong { display: block; font-size: 1rem; font-weight: 800; margin-bottom: 4px; }
.player-row .info span { font-size: 0.75rem; color: var(--green-bright); font-weight: 700; }

.alert {
  padding: 14px 18px; border-radius: 14px; margin-bottom: 18px;
  font-weight: 700; display: none;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  animation: slideDown 0.3s ease;
}
@keyframes slideDown { from{opacity:0;transform:translateY(-10px);} to{opacity:1;transform:translateY(0);} }
.alert-success { background: linear-gradient(135deg, rgba(16,185,129,0.3), rgba(16,185,129,0.15)); border: 1px solid var(--green-bright); color: #d1fae5; box-shadow: 0 8px 24px rgba(16,185,129,0.25); }
.alert-error { background: linear-gradient(135deg, rgba(239,68,68,0.3), rgba(239,68,68,0.15)); border: 1px solid var(--red-bright); color: #fee2e2; box-shadow: 0 8px 24px rgba(239,68,68,0.25); }

input[type="file"] { padding: 10px; cursor: pointer; }
input[type="file"]::file-selector-button {
  background: linear-gradient(135deg, var(--green), var(--green-deep));
  color: #fff; border: none; padding: 8px 16px; border-radius: 10px;
  font-weight: 700; font-family: inherit; cursor: pointer; margin-left: 12px;
  box-shadow: 0 4px 12px rgba(16,185,129,0.4); transition: all 0.2s;
}
input[type="file"]::file-selector-button:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(16,185,129,0.5); }

@media (max-width: 480px) {
  body { padding: 12px; }
  .header { padding: 14px 16px; border-radius: 20px; }
  .card { padding: 18px; border-radius: 20px; }
  .slider-label { width: 100px; font-size: 0.78rem; }
  .logo-text h1 { font-size: 1.1rem; }
}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="container">
  <header class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </div>
      <div class="logo-text">
        <h1>إدارة اللاعبين</h1>
        <p>أضف لاعبين الحارة</p>
      </div>
    </div>
    <a href="index.html" class="btn btn-white">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      الرئيسية
    </a>
  </header>

  <div id="alert" class="alert"></div>

  <div class="card">
    <h2>
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      إضافة لاعب جديد
    </h2>
    <form id="playerForm">
      <div class="form-row">
        <div class="form-group">
          <label class="label">اسم اللاعب</label>
          <input type="text" class="input" id="name" placeholder="مثال: محمد" required />
        </div>
        <div class="form-group">
          <label class="label">المركز</label>
          <select class="input" id="position" required>
            <option value="حارس">حارس</option>
            <option value="مدافع">مدافع</option>
            <option value="وسط" selected>وسط</option>
            <option value="مهاجم">مهاجم</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="label">صورة اللاعب</label>
        <input type="file" class="input" id="photo" accept="image/*" />
        <img id="preview" class="photo-preview" style="display:none" alt="" />
      </div>

      <h2 style="margin-top:24px">
        <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        الإحصائيات
      </h2>
      <div id="sliders"></div>

      <button type="submit" class="btn btn-green" id="submitBtn" style="width:100%;margin-top:20px;padding:16px;font-size:1rem">
        <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
        حفظ اللاعب
      </button>
    </form>
  </div>

  <div class="card">
    <h2>
      <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      اللاعبون المضافون
    </h2>
    <div id="playersList"></div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://ncrycgbrstafdouvipzc.supabase.co',
  'sb_publishable_6t2dkU27Rkinsoo8MhYAEQ_FSgj4G73'
);

const STATS = [
  { key: "strength", label: "القوة البدنية" },
  { key: "shot_power", label: "قوة الفراب" },
  { key: "pace", label: "السرعة" },
  { key: "dribbling", label: "المراوغة" },
  { key: "passing", label: "التمرير" },
  { key: "defense", label: "الدفاع" }
];

let photoFile = null;

// Build sliders
const slidersEl = document.getElementById("sliders");
STATS.forEach(s => {
  const row = document.createElement("div");
  row.className = "slider-row";
  row.innerHTML = `
    <div class="slider-label">${s.label}</div>
    <input type="range" min="1" max="100" value="70" id="stat-${s.key}" />
    <div class="slider-value" id="val-${s.key}">70</div>
  `;
  slidersEl.appendChild(row);
  const input = row.querySelector("input");
  const val = row.querySelector(".slider-value");
  input.addEventListener("input", () => val.textContent = input.value);
});

// Photo preview
const photoInput = document.getElementById("photo");
const preview = document.getElementById("preview");
photoInput.addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  photoFile = file;
  const reader = new FileReader();
  reader.onload = ev => {
    preview.src = ev.target.result;
    preview.style.display = "block";
  };
  reader.readAsDataURL(file);
});

// Save player
document.getElementById("playerForm").addEventListener("submit", async e => {
  e.preventDefault();
  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.innerHTML = "جاري الحفظ...";

  const name = document.getElementById("name").value.trim();
  const position = document.getElementById("position").value;
  if (!name) {
    showAlert("الاسم مطلوب", "error");
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2"><path d="M20 6 9 17l-5-5"/></svg> حفظ اللاعب';
    return;
  }

  try {
    // 1. Upload photo to storage
    let photoUrl = "";
    if (photoFile) {
      const fileExt = photoFile.name.split(".").pop();
      const fileName = `${Date.now()}-${Math.random().toString(36).substring(7)}.${fileExt}`;

      const { error: uploadError } = await supabase.storage
        .from("player-photos")
        .upload(fileName, photoFile);

      if (uploadError) throw new Error("فشل رفع الصورة: " + uploadError.message);

      const { data: urlData } = supabase.storage
        .from("player-photos")
        .getPublicUrl(fileName);

      photoUrl = urlData.publicUrl;
    }

    // 2. Build player object
    const player = {
      name,
      position,
      photo: photoUrl,
      strength: parseInt(document.getElementById("stat-strength").value),
      shot_power: parseInt(document.getElementById("stat-shot_power").value),
      pace: parseInt(document.getElementById("stat-pace").value),
      dribbling: parseInt(document.getElementById("stat-dribbling").value),
      passing: parseInt(document.getElementById("stat-passing").value),
      defense: parseInt(document.getElementById("stat-defense").value)
    };

    // 3. Insert into DB
    const { error: insertError } = await supabase
      .from("players")
      .insert([player]);

    if (insertError) throw new Error("فشل الإضافة: " + insertError.message);

    showAlert("✅ تم إضافة اللاعب " + name + " بنجاح", "success");

    // Reset
    e.target.reset();
    preview.style.display = "none";
    photoFile = null;
    STATS.forEach(s => {
      document.getElementById("stat-" + s.key).value = 70;
      document.getElementById("val-" + s.key).textContent = 70;
    });

    loadPlayers();
  } catch (err) {
    showAlert("❌ " + err.message, "error");
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2"><path d="M20 6 9 17l-5-5"/></svg> حفظ اللاعب';
  }
});

function showAlert(msg, type) {
  const el = document.getElementById("alert");
  el.textContent = msg;
  el.className = "alert alert-" + type;
  el.style.display = "block";
  setTimeout(() => el.style.display = "none", 4000);
}

async function loadPlayers() {
  const list = document.getElementById("playersList");
  list.innerHTML = '<p style="color:rgba(255,255,255,0.5);text-align:center;padding:24px;font-weight:600">جاري التحميل...</p>';

  const { data, error } = await supabase
    .from("players")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    list.innerHTML = `<p style="color:#fca5a5;text-align:center;padding:24px">خطأ: ${error.message}</p>`;
    return;
  }

  if (!data || data.length === 0) {
    list.innerHTML = '<p style="color:rgba(255,255,255,0.5);text-align:center;padding:24px;font-weight:600">ما فيه لاعبين بعد</p>';
    return;
  }

  list.innerHTML = data.map(p => `
    <div class="player-row">
      <img src="${p.photo || 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23062b1a%22><circle cx=%2212%22 cy=%228%22 r=%224%22/><path d=%22M4 22c0-4 4-7 8-7s8 3 8 7%22/></svg>'}" alt="" onerror="this.style.display='none'" />
      <div class="info">
        <strong>${p.name}</strong>
        <span>${p.position}</span>
      </div>
      <button class="btn btn-red btn-small" onclick="removePlayer('${p.id}')">حذف</button>
    </div>
  `).join("");
}

window.removePlayer = async function(id) {
  if (!confirm("تأكيد الحذف؟")) return;
  const { error } = await supabase.from("players").delete().eq("id", id);
  if (error) return alert("خطأ: " + error.message);
  loadPlayers();
};

loadPlayers();
</script>
</body>
</html>
