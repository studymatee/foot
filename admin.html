<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>إدارة اللاعبين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #16a34a; --green-bright: #22c55e; --green-deep: #15803d; --green-light: #dcfce7;
  --red: #dc2626; --red-bright: #ef4444; --red-light: #fee2e2;
  --bg: #f8fafc; --card: #ffffff; --text: #0f172a;
  --text-muted: #64748b; --border: #e2e8f0;
}
html, body { height: 100%; }
body {
  font-family: 'Cairo', system-ui, sans-serif;
  color: var(--text); background: var(--bg);
  min-height: 100vh; padding: 20px; direction: rtl;
  overflow-x: hidden; position: relative;
}
body::before, body::after {
  content: ""; position: fixed; border-radius: 50%;
  filter: blur(120px); z-index: 0; pointer-events: none;
}
body::before {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(239,68,68,0.18), transparent 70%);
  top: -150px; right: -150px;
}
body::after {
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(34,197,94,0.2), transparent 70%);
  bottom: -200px; left: -200px;
}
.grid-bg {
  position: fixed; inset: 0;
  background-image: linear-gradient(rgba(22,163,74,0.06) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(22,163,74,0.06) 1px, transparent 1px);
  background-size: 45px 45px; z-index: 0; pointer-events: none;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
}
.container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }

#loginScreen {
  position: fixed; inset: 0;
  background: linear-gradient(135deg, #f0fdf4, #fef2f2);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px;
}
.login-card {
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 28px; padding: 40px 32px;
  box-shadow: 0 20px 60px rgba(15,23,42,0.15);
  width: 100%; max-width: 420px; text-align: center;
  animation: slideUp 0.5s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.login-icon {
  width: 80px; height: 80px; border-radius: 24px;
  background: linear-gradient(135deg, var(--green-bright), var(--green-deep));
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 20px;
  box-shadow: 0 12px 32px rgba(22,163,74,0.4);
}
.login-icon svg { width: 40px; height: 40px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.login-card h2 { font-size: 1.6rem; font-weight: 900; margin-bottom: 8px; }
.login-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; font-weight: 600; }
.pass-input {
  width: 100%; padding: 16px 20px; border-radius: 16px;
  border: 2px solid var(--border); background: #fff;
  color: var(--text); font-size: 1.1rem; text-align: center;
  outline: none; transition: all 0.25s; font-family: inherit;
  font-weight: 700; letter-spacing: 1px; margin-bottom: 16px;
}
.pass-input:focus { border-color: var(--green-bright); box-shadow: 0 0 0 4px rgba(34,197,94,0.15); }
.login-btn {
  width: 100%; padding: 16px; border-radius: 16px; border: none;
  background: linear-gradient(135deg, var(--green-bright), var(--green-deep));
  color: #fff; font-size: 1rem; font-weight: 800; cursor: pointer;
  transition: all 0.25s; font-family: inherit;
  box-shadow: 0 8px 24px rgba(22,163,74,0.4);
}
.login-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(22,163,74,0.5); }
.login-error {
  color: var(--red); font-weight: 700; font-size: 0.85rem;
  margin-top: 12px; display: none;
}

#mainContent { display: none; }

.header {
  background: rgba(255,255,255,0.85);
  border: 1px solid var(--border);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 24px; padding: 18px 22px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px; flex-wrap: wrap; gap: 14px;
  box-shadow: 0 10px 40px rgba(15,23,42,0.08);
}
.logo { display: flex; align-items: center; gap: 14px; }
.logo-icon {
  width: 52px; height: 52px; border-radius: 16px;
  background: linear-gradient(135deg, var(--red-bright), #b91c1c);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px rgba(239,68,68,0.4);
}
.logo-icon svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.logo-text h1 {
  font-size: 1.3rem; font-weight: 900;
  background: linear-gradient(135deg, var(--red), var(--red-bright));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.logo-text p { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 20px; border-radius: 14px;
  font-weight: 700; font-size: 0.9rem; cursor: pointer; border: none;
  transition: all 0.25s; text-decoration: none; font-family: inherit;
}
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.btn-green { background: linear-gradient(135deg, var(--green-bright), var(--green-deep)); color: #fff; box-shadow: 0 8px 24px rgba(22,163,74,0.35); }
.btn-green:hover { transform: translateY(-3px); }
.btn-green:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.btn-red { background: linear-gradient(135deg, var(--red-bright), #b91c1c); color: #fff; box-shadow: 0 8px 24px rgba(239,68,68,0.35); }
.btn-red:hover { transform: translateY(-3px); }
.btn-white { background: #fff; color: var(--green-deep); box-shadow: 0 8px 24px rgba(15,23,42,0.08); border: 1px solid var(--border); }
.btn-white:hover { transform: translateY(-3px); background: #f8fafc; }
.btn-small { padding: 7px 14px; font-size: 0.8rem; border-radius: 10px; }

.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 24px; padding: 24px; margin-bottom: 22px;
  box-shadow: 0 8px 32px rgba(15,23,42,0.06);
}
.card h2 {
  font-size: 1.15rem; margin-bottom: 20px; color: var(--text);
  display: flex; align-items: center; gap: 10px; font-weight: 800;
}
.card h2 svg { width: 22px; height: 22px; stroke: var(--green); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.label { display: block; margin-bottom: 8px; font-size: 0.85rem; font-weight: 700; color: var(--text); }
.input {
  width: 100%; padding: 12px 16px; border-radius: 14px;
  border: 2px solid var(--border); background: #fff; color: var(--text);
  font-size: 0.95rem; outline: none; transition: all 0.25s; font-family: inherit;
}
.input:focus { border-color: var(--green-bright); box-shadow: 0 0 0 4px rgba(34,197,94,0.15); }
.input::placeholder { color: #94a3b8; }

.form-group { margin-bottom: 18px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 600px) { .form-row { grid-template-columns: 1fr; gap: 0; } }

.slider-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; padding: 8px; border-radius: 12px; transition: background 0.2s; }
.slider-row:hover { background: var(--green-light); }
.slider-label { width: 130px; font-size: 0.85rem; color: var(--text); font-weight: 700; flex-shrink: 0; }
input[type="range"] {
  flex: 1; height: 6px; border-radius: 999px;
  background: #e2e8f0; outline: none;
  -webkit-appearance: none; appearance: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 22px; height: 22px; border-radius: 50%;
  background: linear-gradient(135deg, var(--green-bright), var(--green));
  cursor: pointer; border: 3px solid #fff;
  box-shadow: 0 4px 12px rgba(22,163,74,0.4);
}
input[type="range"]::-moz-range-thumb {
  width: 22px; height: 22px; border-radius: 50%;
  background: linear-gradient(135deg, var(--green-bright), var(--green));
  cursor: pointer; border: 3px solid #fff;
}
.slider-value {
  width: 48px; text-align: center; font-weight: 800;
  background: var(--green-light); border: 1px solid rgba(22,163,74,0.3);
  border-radius: 10px; padding: 5px; font-size: 0.85rem; color: var(--green-deep);
}

.photo-preview {
  width: 120px; height: 120px; border-radius: 20px; object-fit: cover;
  border: 3px solid var(--green-bright); background: var(--green-light);
  margin-top: 12px; box-shadow: 0 8px 24px rgba(22,163,74,0.25);
  display: block;
}

.photo-hint {
  font-size: 0.8rem; color: var(--text-muted); margin-top: 8px;
  font-weight: 600; display: flex; align-items: center; gap: 6px;
}
.photo-hint svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

.player-row {
  display: flex; align-items: center; gap: 14px; padding: 14px;
  background: #f8fafc; border: 1px solid var(--border);
  border-radius: 16px; margin-bottom: 10px; transition: all 0.25s;
}
.player-row:hover { background: var(--green-light); border-color: rgba(22,163,74,0.3); }
.player-row img {
  width: 56px; height: 56px; border-radius: 14px; object-fit: cover;
  border: 2px solid var(--green-bright); background: var(--green-light);
  flex-shrink: 0;
}
.player-row .info { flex: 1; min-width: 0; }
.player-row .info strong { display: block; font-size: 1rem; font-weight: 800; margin-bottom: 4px; }
.player-row .info span { font-size: 0.75rem; color: var(--green-deep); font-weight: 700; }

.alert {
  padding: 14px 18px; border-radius: 14px; margin-bottom: 18px;
  font-weight: 700; display: none;
}
.alert-success { background: var(--green-light); border: 1px solid var(--green-bright); color: var(--green-deep); }
.alert-error { background: var(--red-light); border: 1px solid var(--red-bright); color: var(--red); }

input[type="file"] { padding: 10px; cursor: pointer; }
input[type="file"]::file-selector-button {
  background: linear-gradient(135deg, var(--green-bright), var(--green-deep));
  color: #fff; border: none; padding: 8px 16px; border-radius: 10px;
  font-weight: 700; font-family: inherit; cursor: pointer; margin-left: 12px;
}

.progress-bar {
  width: 100%; height: 6px; background: #e2e8f0; border-radius: 999px;
  overflow: hidden; margin-top: 12px; display: none;
}
.progress-bar.show { display: block; }
.progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--green-bright), var(--green-deep));
  border-radius: 999px; transition: width 0.3s; width: 0%;
}

@media (max-width: 480px) {
  body { padding: 12px; }
  .header { padding: 14px 16px; border-radius: 20px; }
  .card { padding: 18px; border-radius: 20px; }
  .slider-label { width: 100px; font-size: 0.78rem; }
  .logo-text h1 { font-size: 1.1rem; }
  .login-card { padding: 32px 24px; }
  .photo-preview { width: 100px; height: 100px; }
}
</style>
</head>
<body>
<div class="grid-bg"></div>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-icon">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h2>منطقة الإدارة</h2>
    <p>اكتب كلمة السر باش تدخل</p>
    <input type="password" class="pass-input" id="passwordInput" placeholder="••••••••" />
    <button class="login-btn" onclick="checkPassword()">دخول</button>
    <div class="login-error" id="loginError">كلمة السر غالطة</div>
  </div>
</div>

<div class="container" id="mainContent">
  <header class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </div>
      <div class="logo-text">
        <h1>إدارة اللاعبين</h1>
        <p>أضف لاعبين الحومة 🇩🇿</p>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a href="index.html" class="btn btn-white">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        الرئيسية
      </a>
      <button class="btn btn-red" onclick="logout()">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        خروج
      </button>
    </div>
  </header>

  <div id="alert" class="alert"></div>

  <div class="card">
    <h2>
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      زيد لاعب جديد
    </h2>
    <form id="playerForm">
      <div class="form-row">
        <div class="form-group">
          <label class="label">اسم اللاعب</label>
          <input type="text" class="input" id="name" placeholder="مثال: محمد" required />
        </div>
        <div class="form-group">
          <label class="label">المركز</label>
          <select class="input" id="position" required>
            <option value="حارس">حارس</option>
            <option value="مدافع">مدافع</option>
            <option value="وسط" selected>وسط</option>
            <option value="مهاجم">مهاجم</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="label">صورة اللاعب</label>
        <input type="file" class="input" id="photo" accept="image/*" />
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <img id="preview" class="photo-preview" style="display:none" alt="" />
        <p class="photo-hint">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          الصورة تتحول Base64 وتتحفظ مع اللاعب — كل واحد غادي يشوفها
        </p>
      </div>

      <h2 style="margin-top:24px">
        <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        الإحصائيات
      </h2>
      <div id="sliders"></div>

      <button type="submit" class="btn btn-green" id="submitBtn" style="width:100%;margin-top:20px;padding:16px;font-size:1rem">
        <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
        سجّل اللاعب
      </button>
    </form>
  </div>

  <div class="card">
    <h2>
      <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      اللاعبين المسجلين
    </h2>
    <div id="playersList"></div>
  </div>
</div>

<script>
const ADMIN_PASSWORD = "كرة حارة";
const SUPABASE_URL = "https://ncrycgbrstafdouvipzc.supabase.co";
const SUPABASE_KEY = "sb_publishable_6t2dkU27Rkinsoo8MhYAEQ_FSgj4G73";

window.checkPassword = function() {
  const input = document.getElementById("passwordInput").value.trim();
  const error = document.getElementById("loginError");
  if (input === ADMIN_PASSWORD) {
    sessionStorage.setItem("admin_logged", "1");
    showMain();
    playSound("success");
  } else {
    error.style.display = "block";
    playSound("error");
  }
};

window.logout = function() {
  sessionStorage.removeItem("admin_logged");
  location.reload();
};

function showMain() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("mainContent").style.display = "block";
  loadPlayers();
}

document.getElementById("passwordInput").addEventListener("keypress", e => {
  if (e.key === "Enter") checkPassword();
});

if (sessionStorage.getItem("admin_logged") === "1") {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("mainContent").style.display = "block";
}

function playSound(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if (type === "success") {
      osc.frequency.setValueAtTime(523, ctx.currentTime);
      osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
      osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
      osc.start(); osc.stop(ctx.currentTime + 0.35);
    } else {
      osc.frequency.setValueAtTime(200, ctx.currentTime);
      osc.frequency.setValueAtTime(150, ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      osc.start(); osc.stop(ctx.currentTime + 0.3);
    }
  } catch(e) {}
}

const STATS = [
  { key: "strength", label: "القوة البدنية" },
  { key: "shot_power", label: "قوة الفراب" },
  { key: "pace", label: "السرعة" },
  { key: "dribbling", label: "المراوغة" },
  { key: "passing", label: "التمرير" },
  { key: "defense", label: "الدفاع" }
];

let photoData = "";

const slidersEl = document.getElementById("sliders");
STATS.forEach(s => {
  const row = document.createElement("div");
  row.className = "slider-row";
  row.innerHTML = `
    <div class="slider-label">${s.label}</div>
    <input type="range" min="1" max="100" value="70" id="stat-${s.key}" />
    <div class="slider-value" id="val-${s.key}">70</div>
  `;
  slidersEl.appendChild(row);
  const input = row.querySelector("input");
  const val = row.querySelector(".slider-value");
  input.addEventListener("input", () => val.textContent = input.value);
});

const photoInput = document.getElementById("photo");
const preview = document.getElementById("preview");
const progressBar = document.getElementById("progressBar");
const progressFill = document.getElementById("progressFill");

photoInput.addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;

  if (file.size > 5 * 1024 * 1024) {
    showAlert("الصورة كبيرة بزاف! اختار صورة أقل من 5 ميغا", "error");
    photoInput.value = "";
    return;
  }

  progressBar.classList.add("show");
  progressFill.style.width = "0%";

  const reader = new FileReader();

  reader.onprogress = (ev) => {
    if (ev.lengthComputable) {
      progressFill.style.width = ((ev.loaded / ev.total) * 100) + "%";
    }
  };

  reader.onload = (ev) => {
    compressImage(ev.target.result, (compressed) => {
      photoData = compressed;
      preview.src = compressed;
      preview.style.display = "block";
      progressFill.style.width = "100%";
      setTimeout(() => progressBar.classList.remove("show"), 500);
    });
  };

  reader.readAsDataURL(file);
});

function compressImage(base64, callback) {
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    const MAX = 300;
    let w = img.width, h = img.height;
    if (w > h) {
      if (w > MAX) { h = (h * MAX) / w; w = MAX; }
    } else {
      if (h > MAX) { w = (w * MAX) / h; h = MAX; }
    }
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, w, h);
    callback(canvas.toDataURL("image/jpeg", 0.7));
  };
  img.src = base64;
}

document.getElementById("playerForm").addEventListener("submit", async e => {
  e.preventDefault();
  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.innerHTML = "جاري التسجيل...";

  const name = document.getElementById("name").value.trim();
  const position = document.getElementById("position").value;
  if (!name) {
    showAlert("الاسم مطلوب", "error");
    submitBtn.disabled = false;
    submitBtn.innerHTML = "سجّل اللاعب";
    return;
  }

  try {
    const player = {
      name, position,
      photo: photoData || "",
      strength: parseInt(document.getElementById("stat-strength").value),
      shot_power: parseInt(document.getElementById("stat-shot_power").value),
      pace: parseInt(document.getElementById("stat-pace").value),
      dribbling: parseInt(document.getElementById("stat-dribbling").value),
      passing: parseInt(document.getElementById("stat-passing").value),
      defense: parseInt(document.getElementById("stat-defense").value)
    };

    // نستخدم fetch مباشرة — الحفظ في جدول players فقط
    const res = await fetch(`${SUPABASE_URL}/rest/v1/players`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify([player])
    });

    if (!res.ok) {
      const err = await res.text();
      throw new Error("فشل الإضافة: " + err);
    }

    showAlert("تسجّل اللاعب " + name + " بنجاح", "success");
    playSound("success");

    e.target.reset();
    preview.style.display = "none";
    photoData = "";
    STATS.forEach(s => {
      document.getElementById("stat-" + s.key).value = 70;
      document.getElementById("val-" + s.key).textContent = 70;
    });
    loadPlayers();
  } catch (err) {
    showAlert("خطأ: " + err.message, "error");
    playSound("error");
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = 'سجّل اللاعب';
  }
});

function showAlert(msg, type) {
  const el = document.getElementById("alert");
  el.textContent = msg;
  el.className = "alert alert-" + type;
  el.style.display = "block";
  setTimeout(() => el.style.display = "none", 4000);
}

async function loadPlayers() {
  const list = document.getElementById("playersList");
  list.innerHTML = '<p style="color:#94a3b8;text-align:center;padding:24px;font-weight:600">جاري التحميل...</p>';

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/players?select=*&order=created_at.desc`, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    });

    if (!res.ok) throw new Error("فشل التحميل");
    const data = await res.json();

    if (!data || data.length === 0) {
      list.innerHTML = '<p style="color:#94a3b8;text-align:center;padding:24px;font-weight:600">ما فيه لاعبين مسجلين</p>';
      return;
    }

    list.innerHTML = data.map(p => `
      <div class="player-row">
        <img src="${p.photo || 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23dcfce7%22><circle cx=%2212%22 cy=%228%22 r=%224%22/><path d=%22M4 22c0-4 4-7 8-7s8 3 8 7%22/></svg>'}" alt="" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23dcfce7%22><circle cx=%2212%22 cy=%228%22 r=%224%22/><path d=%22M4 22c0-4 4-7 8-7s8 3 8 7%22/></svg>'" />
        <div class="info">
          <strong>${p.name}</strong>
          <span>${p.position}</span>
        </div>
        <button class="btn btn-red btn-small" onclick="removePlayer('${p.id}')">حيّد</button>
      </div>
    `).join("");
  } catch (err) {
    list.innerHTML = `<p style="color:#dc2626;text-align:center;padding:24px">خطأ: ${err.message}</p>`;
  }
}

window.removePlayer = async function(id) {
  if (!confirm("متأكد تحيّد هذا اللاعب؟")) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/players?id=eq.${id}`, {
      method: "DELETE",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    });
    if (!res.ok) throw new Error("فشل الحذف");
    playSound("success");
    loadPlayers();
  } catch (err) {
    alert("خطأ: " + err.message);
  }
};
</script>
