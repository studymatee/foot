<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>إدارة اللاعبين</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #16a34a; --green-dark: #14532d; --green-light: #22c55e;
  --red: #dc2626; --red-dark: #991b1b;
}
body {
  background: linear-gradient(135deg, #052e16 0%, #14532d 60%, #166534 100%);
  color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  min-height: 100vh; padding: 16px; direction: rtl;
}
.container { max-width: 900px; margin: 0 auto; }
.header {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
  backdrop-filter: blur(12px); border-radius: 16px; padding: 16px 20px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
}
.logo { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  background: var(--red); width: 44px; height: 44px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
}
.logo-icon svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 2; }
.logo-text h1 { font-size: 1.25rem; font-weight: 900; }
.logo-text p { font-size: 0.75rem; color: #fca5a5; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 0.9rem;
  cursor: pointer; border: none; transition: all 0.2s; text-decoration: none;
  font-family: inherit;
}
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: #15803d; transform: translateY(-2px); }
.btn-red { background: var(--red); color: #fff; }
.btn-red:hover { background: var(--red-dark); transform: translateY(-2px); }
.btn-white { background: #fff; color: var(--green-dark); }
.btn-white:hover { background: #f0fdf4; }
.btn-small { padding: 6px 12px; font-size: 0.8rem; }
.card {
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(12px); border-radius: 16px; padding: 20px; margin-bottom: 20px;
}
.card h2 { font-size: 1.1rem; margin-bottom: 16px; color: #86efac; }
.label { display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; color: #86efac; }
.input {
  width: 100%; padding: 10px 14px; border-radius: 10px;
  border: 2px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.25);
  color: #fff; font-size: 0.95rem; outline: none; transition: border 0.2s;
  font-family: inherit;
}
.input:focus { border-color: var(--green-light); }
.input::placeholder { color: rgba(255,255,255,0.4); }
.form-group { margin-bottom: 16px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
.slider-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.slider-label { width: 130px; font-size: 0.85rem; color: #86efac; font-weight: 600; }
input[type="range"] {
  flex: 1; height: 6px; border-radius: 999px; background: rgba(255,255,255,0.15);
  outline: none; -webkit-appearance: none; appearance: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 20px; height: 20px;
  border-radius: 50%; background: var(--green-light); cursor: pointer;
  border: 2px solid #fff;
}
input[type="range"]::-moz-range-thumb {
  width: 20px; height: 20px; border-radius: 50%; background: var(--green-light);
  cursor: pointer; border: 2px solid #fff;
}
.slider-value {
  width: 42px; text-align: center; font-weight: 800;
  background: rgba(255,255,255,0.1); border-radius: 8px; padding: 4px;
}
.photo-preview {
  width: 90px; height: 90px; border-radius: 50%; object-fit: cover;
  border: 3px solid var(--green); background: #0f3d20; margin-top: 10px;
}
.player-row {
  display: flex; align-items: center; gap: 12px; padding: 12px;
  background: rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 10px;
}
.player-row img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid var(--green); }
.player-row .info { flex: 1; }
.player-row .info strong { display: block; font-size: 0.95rem; }
.player-row .info span { font-size: 0.75rem; color: #86efac; }
.alert {
  padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-weight: 600;
  display: none;
}
.alert-success { background: rgba(22,163,74,0.25); border: 1px solid var(--green-light); color: #86efac; }
.alert-error { background: rgba(220,38,38,0.25); border: 1px solid #fca5a5; color: #fca5a5; }
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </div>
      <div class="logo-text">
        <h1>إدارة اللاعبين</h1>
        <p>أضف وعدّل لاعبين الحارة</p>
      </div>
    </div>
    <a href="index.html" class="btn btn-white">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      الرئيسية
    </a>
  </header>

  <div id="alert" class="alert"></div>

  <!-- Form -->
  <div class="card">
    <h2>➕ إضافة لاعب جديد</h2>
    <form id="playerForm">
      <div class="form-row">
        <div class="form-group">
          <label class="label">اسم اللاعب</label>
          <input type="text" class="input" id="name" placeholder="مثال: محمد" required />
        </div>
        <div class="form-group">
          <label class="label">المركز</label>
          <select class="input" id="position" required>
            <option value="حارس">حارس</option>
            <option value="مدافع">مدافع</option>
            <option value="وسط" selected>وسط</option>
            <option value="مهاجم">مهاجم</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="label">صورة اللاعب</label>
        <input type="file" class="input" id="photo" accept="image/*" />
        <img id="preview" class="photo-preview" style="display:none" alt="" />
      </div>

      <h3 style="margin:20px 0 12px;font-size:1rem;color:#fff">الإحصائيات</h3>
      <div id="sliders"></div>

      <button type="submit" class="btn btn-green" style="width:100%;margin-top:16px;padding:14px">
        <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
        حفظ اللاعب
      </button>
    </form>
  </div>

  <!-- Players list -->
  <div class="card">
    <h2>📋 اللاعبون المضافون</h2>
    <div id="playersList"></div>
  </div>
</div>

<script>
const STORAGE_KEY = "harey_players";

const STATS = [
  { key: "strength", label: "القوة البدنية" },
  { key: "shotPower", label: "قوة الفراب" },
  { key: "pace", label: "السرعة" },
  { key: "dribbling", label: "المراوغة" },
  { key: "passing", label: "التمرير" },
  { key: "defense", label: "الدفاع" }
];

let photoData = "";

// Build sliders
const slidersEl = document.getElementById("sliders");
STATS.forEach(s => {
  const row = document.createElement("div");
  row.className = "slider-row";
  row.innerHTML = `
    <div class="slider-label">${s.label}</div>
    <input type="range" min="1" max="100" value="70" id="stat-${s.key}" />
    <div class="slider-value" id="val-${s.key}">70</div>
  `;
  slidersEl.appendChild(row);
  const input = row.querySelector("input");
  const val = row.querySelector(".slider-value");
  input.addEventListener("input", () => val.textContent = input.value);
});

// Photo preview
const photoInput = document.getElementById("photo");
const preview = document.getElementById("preview");
photoInput.addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    photoData = ev.target.result;
    preview.src = photoData;
    preview.style.display = "block";
  };
  reader.readAsDataURL(file);
});

// Save player
document.getElementById("playerForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = document.getElementById("name").value.trim();
  const position = document.getElementById("position").value;
  if (!name) return showAlert("الاسم مطلوب", "error");

  const stats = {};
  STATS.forEach(s => {
    stats[s.key] = parseInt(document.getElementById("stat-" + s.key).value);
  });

  const player = {
    id: Date.now().toString(),
    name, position,
    photo: photoData || "",
    stats,
    createdAt: Date.now()
  };

  const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  all.push(player);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(all));

  showAlert("✅ تم إضافة اللاعب " + name, "success");
  e.target.reset();
  preview.style.display = "none";
  photoData = "";
  STATS.forEach(s => {
    document.getElementById("stat-" + s.key).value = 70;
    document.getElementById("val-" + s.key).textContent = 70;
  });
  renderList();
});

function showAlert(msg, type) {
  const el = document.getElementById("alert");
  el.textContent = msg;
  el.className = "alert alert-" + type;
  el.style.display = "block";
  setTimeout(() => el.style.display = "none", 3000);
}

function renderList() {
  const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  const list = document.getElementById("playersList");
  if (all.length === 0) {
    list.innerHTML = '<p style="color:#86efac;text-align:center;padding:20px">ما فيه لاعبين بعد</p>';
    return;
  }
  list.innerHTML = all.map(p => `
    <div class="player-row">
      <img src="${p.photo || 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%2314532d%22><circle cx=%2212%22 cy=%228%22 r=%224%22/><path d=%22M4 22c0-4 4-7 8-7s8 3 8 7%22/></svg>'}" alt="" />
      <div class="info">
        <strong>${p.name}</strong>
        <span>${p.position}</span>
      </div>
      <button class="btn btn-red btn-small" onclick="removePlayer('${p.id}')">حذف</button>
    </div>
  `).join("");
}

function removePlayer(id) {
  if (!confirm("تأكيد الحذف؟")) return;
  let all = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  all = all.filter(p => p.id !== id);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
  renderList();
}

renderList();
</script>
</body>
</html>
