<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>كرة الحارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #10b981; --green-bright: #34d399; --green-deep: #064e3b;
  --red: #ef4444; --red-bright: #f87171;
  --bg-1: #041a10; --bg-2: #062b1a;
}
html, body { height: 100%; }
body {
  font-family: 'Cairo', system-ui, sans-serif;
  color: #fff; background: var(--bg-1);
  min-height: 100vh; padding: 20px; direction: rtl;
  overflow-x: hidden; position: relative;
}
body::before, body::after {
  content: ""; position: fixed; border-radius: 50%;
  filter: blur(120px); z-index: -1; pointer-events: none;
}
body::before {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(16,185,129,0.55), transparent 70%);
  top: -150px; right: -150px;
  animation: float1 14s ease-in-out infinite;
}
body::after {
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(239,68,68,0.35), transparent 70%);
  bottom: -200px; left: -200px;
  animation: float2 18s ease-in-out infinite;
}
@keyframes float1 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-60px,60px) scale(1.15);} }
@keyframes float2 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(80px,-60px) scale(1.1);} }
.grid-bg {
  position: fixed; inset: 0;
  background-image: linear-gradient(rgba(52,211,153,0.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(52,211,153,0.05) 1px, transparent 1px);
  background-size: 45px 45px; z-index: -1; pointer-events: none;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
}
.container { max-width: 1200px; margin: 0 auto; position: relative; }

.header {
  background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
  border: 1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 24px; padding: 18px 22px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px; flex-wrap: wrap; gap: 14px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
  position: relative; overflow: hidden;
}
.header::before {
  content: ""; position: absolute; top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(52,211,153,0.15), transparent);
  animation: shine 4s infinite;
}
@keyframes shine { 0%{left:-100%;} 60%,100%{left:100%;} }

.logo { display: flex; align-items: center; gap: 14px; z-index: 1; }
.logo-icon {
  width: 52px; height: 52px; border-radius: 16px;
  background: linear-gradient(135deg, var(--green), var(--green-deep));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px rgba(16,185,129,0.5), inset 0 1px 0 rgba(255,255,255,0.3);
  position: relative;
}
.logo-icon::after {
  content: ""; position: absolute; inset: -2px; border-radius: 18px;
  background: linear-gradient(135deg, var(--green-bright), transparent, var(--red));
  z-index: -1; opacity: 0.5; filter: blur(8px);
}
.logo-icon svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.logo-text h1 {
  font-size: 1.4rem; font-weight: 900;
  background: linear-gradient(135deg, #fff, var(--green-bright));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.logo-text p { font-size: 0.75rem; color: rgba(255,255,255,0.55); font-weight: 500; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 20px; border-radius: 14px;
  font-weight: 700; font-size: 0.9rem; cursor: pointer; border: none;
  transition: all 0.25s cubic-bezier(.4,0,.2,1);
  text-decoration: none; font-family: inherit;
  position: relative; overflow: hidden; z-index: 1;
}
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.btn-red {
  background: linear-gradient(135deg, var(--red), #b91c1c);
  color: #fff;
  box-shadow: 0 8px 24px rgba(239,68,68,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
}
.btn-red:hover { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(239,68,68,0.6), inset 0 1px 0 rgba(255,255,255,0.3); }
.btn-green {
  background: linear-gradient(135deg, var(--green), var(--green-deep));
  color: #fff;
  box-shadow: 0 8px 24px rgba(16,185,129,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
}
.btn-green:hover { transform: translateY(-3px); box-shadow: 0 14px 32px rgba(16,185,129,0.6); }

.players-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

.player-card {
  background: linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));
  border: 1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  border-radius: 24px; padding: 20px;
  transition: all 0.35s cubic-bezier(.4,0,.2,1);
  position: relative; overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
}
.player-card::before {
  content: ""; position: absolute; top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: conic-gradient(from 0deg, transparent, rgba(52,211,153,0.15), transparent 30%);
  animation: rotate 8s linear infinite; opacity: 0; transition: opacity 0.4s; z-index: 0;
}
.player-card:hover::before { opacity: 1; }
@keyframes rotate { to { transform: rotate(360deg); } }
.player-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 40px rgba(16,185,129,0.15), inset 0 1px 0 rgba(255,255,255,0.2);
}
.player-card > * { position: relative; z-index: 1; }

.player-card-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.player-photo-wrap { position: relative; flex-shrink: 0; }
.player-photo {
  width: 72px; height: 72px; border-radius: 20px; object-fit: cover;
  border: 2px solid rgba(52,211,153,0.5);
  background: var(--bg-2);
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  display: block;
}
.player-info { flex: 1; min-width: 0; }
.player-name { font-size: 1.15rem; font-weight: 800; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.3px; }
.badge-حارس { background: linear-gradient(135deg,#f59e0b,#d97706); color: #422006; box-shadow: 0 4px 12px rgba(245,158,11,0.4); }
.badge-مدافع { background: linear-gradient(135deg,#3b82f6,#1d4ed8); color: #fff; box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
.badge-وسط { background: linear-gradient(135deg,var(--green-bright),var(--green-deep)); color: #fff; box-shadow: 0 4px 12px rgba(16,185,129,0.4); }
.badge-مهاجم { background: linear-gradient(135deg,var(--red-bright),var(--red)); color: #fff; box-shadow: 0 4px 12px rgba(239,68,68,0.4); }

.overall-circle {
  width: 60px; height: 60px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 1.35rem;
  background: radial-gradient(circle, rgba(0,0,0,0.5), rgba(0,0,0,0.2));
  position: relative; flex-shrink: 0;
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
}
.overall-circle::before {
  content: ""; position: absolute; inset: -3px; border-radius: 50%;
  padding: 3px;
  background: conic-gradient(from 180deg, var(--ring-color, var(--green)), transparent 70%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}

.stats { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.stat-row { display: flex; align-items: center; gap: 10px; font-size: 0.78rem; }
.stat-label { width: 92px; color: rgba(255,255,255,0.6); font-weight: 600; flex-shrink: 0; }
.stat-bar-bg { flex: 1; height: 7px; background: rgba(0,0,0,0.4); border-radius: 999px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); }
.stat-bar-fill { height: 100%; border-radius: 999px; transition: width 0.8s cubic-bezier(.4,0,.2,1); box-shadow: 0 0 12px currentColor; }
.stat-value { width: 32px; text-align: left; font-weight: 800; color: #fff; font-size: 0.8rem; }

.loading { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.6); font-weight: 600; }
.spinner {
  width: 44px; height: 44px; border-radius: 50%;
  border: 4px solid rgba(52,211,153,0.2);
  border-top-color: var(--green-bright);
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty {
  text-align: center; padding: 70px 20px;
  background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
  border-radius: 28px; border: 1px dashed rgba(52,211,153,0.35);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.empty svg {
  width: 72px; height: 72px; stroke: var(--green-bright); fill: none; stroke-width: 1.5;
  margin-bottom: 20px; filter: drop-shadow(0 0 20px rgba(52,211,153,0.6));
}
.empty h2 { font-size: 1.4rem; margin-bottom: 10px; color: #fff; }
.empty p { font-size: 0.95rem; margin-bottom: 24px; color: rgba(255,255,255,0.6); }

@media (max-width: 480px) {
  body { padding: 12px; }
  .header { padding: 14px 16px; border-radius: 20px; }
  .logo-icon { width: 44px; height: 44px; }
  .logo-text h1 { font-size: 1.15rem; }
  .players-grid { grid-template-columns: 1fr; gap: 14px; }
  .player-card { border-radius: 20px; padding: 16px; }
  .player-photo { width: 64px; height: 64px; border-radius: 16px; }
  .overall-circle { width: 52px; height: 52px; font-size: 1.15rem; }
  .stat-label { width: 78px; font-size: 0.72rem; }
}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="container">
  <header class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div class="logo-text">
        <h1>كرة الحارة</h1>
        <p>تقييم لاعبي الحارة</p>
      </div>
    </div>
    <a href="admin.html" class="btn btn-red">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      إدارة اللاعبين
    </a>
  </header>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      جاري التحميل...
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://ncrycgbrstafdouvipzc.supabase.co',
  'sb_publishable_6t2dkU27Rkinsoo8MhYAEQ_FSgj4G73'
);

function calcOverall(p) {
  return Math.round((p.strength + p.shot_power + p.pace + p.dribbling + p.passing + p.defense) / 6);
}

function statColor(v) {
  if (v >= 85) return "#22c55e";
  if (v >= 70) return "#84cc16";
  if (v >= 55) return "#eab308";
  if (v >= 40) return "#f97316";
  return "#dc2626";
}

const STAT_LABELS = {
  strength: "القوة البدنية",
  shot_power: "قوة الفراب",
  pace: "السرعة",
  dribbling: "المراوغة",
  passing: "التمرير",
  defense: "الدفاع"
};

function cardHTML(p) {
  const overall = calcOverall(p);
  const statsHTML = Object.keys(STAT_LABELS).map(key => {
    const v = p[key] || 0;
    const c = statColor(v);
    return `
      <div class="stat-row">
        <div class="stat-label">${STAT_LABELS[key]}</div>
        <div class="stat-bar-bg">
          <div class="stat-bar-fill" style="width:${v}%;background:${c};color:${c}"></div>
        </div>
        <div class="stat-value">${v}</div>
      </div>`;
  }).join("");

  const photo = p.photo || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2314532d'><circle cx='12' cy='8' r='4'/><path d='M4 22c0-4 4-7 8-7s8 3 8 7' fill='none' stroke='%2334d399' stroke-width='1.5'/></svg>";

  return `
    <div class="player-card">
      <div class="player-card-top">
        <div class="player-photo-wrap">
          <img class="player-photo" src="${photo}" alt="${p.name}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23062b1a%22><circle cx=%2212%22 cy=%228%22 r=%224%22/><path d=%22M4 22c0-4 4-7 8-7s8 3 8 7%22/></svg>'" />
        </div>
        <div class="player-info">
          <div class="player-name">${p.name}</div>
          <span class="badge badge-${p.position}">${p.position}</span>
        </div>
        <div class="overall-circle" style="--ring-color:${statColor(overall)};color:${statColor(overall)}">${overall}</div>
      </div>
      <div class="stats">${statsHTML}</div>
    </div>`;
}

async function loadPlayers() {
  const content = document.getElementById("content");
  const { data, error } = await supabase
    .from("players")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    content.innerHTML = `<div class="loading">خطأ في التحميل: ${error.message}</div>`;
    return;
  }

  if (!data || data.length === 0) {
    content.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2a10 10 0 0 0 0 20M2 12h20"/>
        </svg>
        <h2>ما فيه لاعبين بعد</h2>
        <p>روح لصفحة الإدارة وأضف أول لاعب</p>
        <a href="admin.html" class="btn btn-green">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          إضافة لاعب
        </a>
      </div>`;
    return;
  }

  const sorted = data.sort((a, b) => calcOverall(b) - calcOverall(a));
  content.innerHTML = `<div class="players-grid">${sorted.map(cardHTML).join("")}</div>`;
}

loadPlayers();
</script>
</body>
</html>
