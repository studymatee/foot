<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>كرة الحومة 🇩🇿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #16a34a;
  --green-bright: #22c55e;
  --green-deep: #15803d;
  --green-light: #dcfce7;
  --red: #dc2626;
  --red-bright: #ef4444;
  --red-light: #fee2e2;
  --blue: #3b82f6;
  --blue-light: #dbeafe;
  --gold: #f59e0b;
  --gold-light: #fef3c7;
  --purple: #8b5cf6;
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
}
html, body { height: 100%; }
body {
  font-family: 'Cairo', system-ui, sans-serif;
  color: var(--text);
  background: var(--bg);
  min-height: 100vh;
  padding: 20px;
  direction: rtl;
  overflow-x: hidden;
  position: relative;
}

body::before, body::after {
  content: "";
  position: fixed;
  border-radius: 50%;
  filter: blur(120px);
  z-index: 0;
  pointer-events: none;
}
body::before {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(34,197,94,0.25), transparent 70%);
  top: -150px; right: -150px;
  animation: float1 14s ease-in-out infinite;
}
body::after {
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(239,68,68,0.18), transparent 70%);
  bottom: -200px; left: -200px;
  animation: float2 18s ease-in-out infinite;
}
@keyframes float1 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-60px,60px) scale(1.15);} }
@keyframes float2 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(80px,-60px) scale(1.1);} }

.grid-bg {
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(22,163,74,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(22,163,74,0.06) 1px, transparent 1px);
  background-size: 45px 45px;
  z-index: 0;
  pointer-events: none;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
}

.container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }

.header {
  background: rgba(255,255,255,0.85);
  border: 1px solid var(--border);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 18px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
  flex-wrap: wrap;
  gap: 14px;
  box-shadow: 0 10px 40px rgba(15,23,42,0.08);
  position: relative;
  overflow: hidden;
}
.header::before {
  content: "";
  position: absolute; top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(34,197,94,0.15), transparent);
  animation: shine 4s infinite;
}
@keyframes shine { 0%{left:-100%;} 60%,100%{left:100%;} }

.logo { display: flex; align-items: center; gap: 14px; z-index: 1; }
.logo-icon {
  width: 52px; height: 52px; border-radius: 16px;
  background: linear-gradient(135deg, var(--green-bright), var(--green-deep));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px rgba(22,163,74,0.4);
}
.logo-icon svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.logo-text h1 {
  font-size: 1.4rem; font-weight: 900;
  background: linear-gradient(135deg, var(--green-deep), var(--green));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.logo-text p { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }

.flag-strip {
  display: flex;
  height: 5px;
  width: 36px;
  border-radius: 999px;
  overflow: hidden;
  margin-top: 5px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.12);
}
.flag-strip span { flex: 1; }
.flag-strip .g { background: #16a34a; }
.flag-strip .w { background: #ffffff; }
.flag-strip .r { background: #dc2626; }

.nav-buttons { display: flex; gap: 8px; flex-wrap: wrap; z-index: 1; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 18px; border-radius: 14px;
  font-weight: 700; font-size: 0.85rem; cursor: pointer; border: none;
  transition: all 0.25s cubic-bezier(.4,0,.2,1);
  text-decoration: none; font-family: inherit; white-space: nowrap;
}
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.btn-white {
  background: #fff; color: var(--green-deep);
  box-shadow: 0 4px 12px rgba(15,23,42,0.08);
  border: 1px solid var(--border);
}
.btn-white:hover { transform: translateY(-2px); background: var(--green-light); }
.btn-green {
  background: linear-gradient(135deg, var(--green-bright), var(--green-deep));
  color: #fff;
  box-shadow: 0 4px 12px rgba(22,163,74,0.35);
}
.btn-green:hover { transform: translateY(-2px); }
.btn-gold {
  background: linear-gradient(135deg, #fbbf24, #d97706);
  color: #fff;
  box-shadow: 0 4px 12px rgba(245,158,11,0.35);
}
.btn-gold:hover { transform: translateY(-2px); }

.stats-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 22px;
}
.stat-mini {
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 4px 16px rgba(15,23,42,0.05);
}
.stat-mini-icon {
  width: 42px; height: 42px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.stat-mini-icon svg { width: 20px; height: 20px; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.stat-mini-icon.g { background: var(--green-light); } .stat-mini-icon.g svg { stroke: var(--green-deep); }
.stat-mini-icon.b { background: var(--blue-light); } .stat-mini-icon.b svg { stroke: #1d4ed8; }
.stat-mini-icon.y { background: var(--gold-light); } .stat-mini-icon.y svg { stroke: #d97706; }
.stat-mini-icon.r { background: var(--red-light); } .stat-mini-icon.r svg { stroke: var(--red); }
.stat-mini-info { min-width: 0; }
.stat-mini-num { font-size: 1.3rem; font-weight: 900; line-height: 1; margin-bottom: 3px; }
.stat-mini-lbl { font-size: 0.72rem; color: var(--text-muted); font-weight: 700; }

.tabs-row {
  display: flex; gap: 8px; margin-bottom: 20px;
  overflow-x: auto; padding-bottom: 6px; scrollbar-width: none;
}
.tabs-row::-webkit-scrollbar { display: none; }
.tab {
  padding: 10px 18px; border-radius: 12px;
  border: 2px solid var(--border); background: #fff;
  font-weight: 700; font-size: 0.82rem; cursor: pointer;
  transition: all 0.25s; font-family: inherit; white-space: nowrap;
  color: var(--text);
}
.tab:hover { border-color: var(--green); transform: translateY(-2px); }
.tab.active {
  background: linear-gradient(135deg, var(--green-bright), var(--green-deep));
  color: #fff; border-color: transparent;
  box-shadow: 0 8px 20px rgba(22,163,74,0.35);
}

.players-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

.player-card {
  background: var(--card);
  border: 1px solid var(--border);
  backdrop-filter: blur(24px);
  border-radius: 24px;
  padding: 20px;
  transition: all 0.35s cubic-bezier(.4,0,.2,1);
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(15,23,42,0.06);
  text-decoration: none;
  color: inherit;
  display: block;
  cursor: pointer;
}
.player-card::before {
  content: "";
  position: absolute; top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: conic-gradient(from 0deg, transparent, rgba(34,197,94,0.12), transparent 30%);
  animation: rotate 8s linear infinite;
  opacity: 0; transition: opacity 0.4s; z-index: 0;
}
.player-card:hover::before { opacity: 1; }
@keyframes rotate { to { transform: rotate(360deg); } }
.player-card:hover {
  transform: translateY(-6px);
  border-color: rgba(22,163,74,0.4);
  box-shadow: 0 20px 50px rgba(15,23,42,0.12), 0 0 40px rgba(34,197,94,0.15);
}
.player-card > * { position: relative; z-index: 1; }

.player-card-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.player-photo-wrap {
  position: relative; flex-shrink: 0;
  width: 72px; height: 72px;
}
.player-photo {
  width: 72px; height: 72px; border-radius: 20px; object-fit: cover;
  border: 2px solid rgba(22,163,74,0.4);
  background: var(--green-light);
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  display: block;
}
.player-info { flex: 1; min-width: 0; }
.player-name {
  font-size: 1.15rem; font-weight: 800; margin-bottom: 6px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--text);
}

.badge {
  display: inline-block; padding: 4px 12px; border-radius: 999px;
  font-size: 0.7rem; font-weight: 800; letter-spacing: 0.3px;
}
.badge-حارس { background: linear-gradient(135deg,#fbbf24,#f59e0b); color: #422006; }
.badge-مدافع { background: linear-gradient(135deg,#60a5fa,#3b82f6); color: #fff; }
.badge-وسط { background: linear-gradient(135deg,var(--green-bright),var(--green-deep)); color: #fff; }
.badge-مهاجم { background: linear-gradient(135deg,var(--red-bright),var(--red)); color: #fff; }

.overall-circle {
  width: 60px; height: 60px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 1.35rem;
  background: radial-gradient(circle, #fff, #f1f5f9);
  position: relative; flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(15,23,42,0.08);
}
.overall-circle::before {
  content: ""; position: absolute; inset: -3px; border-radius: 50%;
  padding: 3px;
  background: conic-gradient(from 180deg, var(--ring-color, var(--green)), transparent 70%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}

.stats-mini {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}
.stat-mini-item {
  text-align: center;
  padding: 8px 4px;
  background: #f8fafc;
  border-radius: 10px;
}
.stat-mini-val { font-weight: 900; font-size: 1rem; color: var(--green-deep); }
.stat-mini-lbl2 { font-size: 0.65rem; color: var(--text-muted); font-weight: 700; margin-top: 2px; }

.points-badge {
  position: absolute;
  top: 12px; left: 12px;
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 900;
  background: linear-gradient(135deg, #fbbf24, #d97706);
  color: #fff;
  box-shadow: 0 4px 12px rgba(245,158,11,0.4);
  display: flex;
  align-items: center;
  gap: 4px;
  z-index: 2;
}
.points-badge svg { width: 12px; height: 12px; stroke: #fff; fill: none; stroke-width: 2.5; }

.loading { text-align: center; padding: 60px 20px; color: var(--text-muted); font-weight: 600; }
.spinner {
  width: 44px; height: 44px; border-radius: 50%;
  border: 4px solid rgba(22,163,74,0.2);
  border-top-color: var(--green);
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.empty {
  text-align: center; padding: 70px 20px;
  background: var(--card);
  border-radius: 28px;
  border: 2px dashed var(--border);
}
.empty svg {
  width: 72px; height: 72px;
  stroke: var(--green); fill: none; stroke-width: 1.5;
  margin-bottom: 20px;
}
.empty h2 { font-size: 1.4rem; margin-bottom: 10px; color: var(--text); }
.empty p { font-size: 0.95rem; margin-bottom: 24px; color: var(--text-muted); font-weight: 600; }

@media (max-width: 480px) {
  body { padding: 12px; }
  .header { padding: 14px 16px; border-radius: 20px; }
  .logo-icon { width: 44px; height: 44px; }
  .logo-text h1 { font-size: 1.15rem; }
  .players-grid { grid-template-columns: 1fr; gap: 14px; }
  .player-card { border-radius: 20px; padding: 16px; }
  .player-photo, .player-photo-wrap { width: 64px; height: 64px; border-radius: 16px; }
  .overall-circle { width: 52px; height: 52px; font-size: 1.15rem; }
  .btn { padding: 9px 14px; font-size: 0.8rem; }
  .stats-bar { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="grid-bg"></div>

<div class="container">
  <header class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div class="logo-text">
        <h1>كرة الحومة</h1>
        <p>تقييم لاعبين الحومة 🇩🇿</p>
        <div class="flag-strip"><span class="g"></span><span class="w"></span><span class="r"></span></div>
      </div>
    </div>
    <div class="nav-buttons">
      <a href="leaderboard.html" class="btn btn-white">
        <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        الترتيب
      </a>
      <a href="matches.html" class="btn btn-white">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0 0 20M2 12h20"/></svg>
        الماتشات
      </a>
      <a href="teams.html" class="btn btn-green">
        <svg viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
        قسّم الفرق
      </a>
      <a href="compare.html" class="btn btn-gold">
        <svg viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M8 21H3v-5"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/></svg>
        قارن
      </a>
    </div>
  </header>

  <div class="stats-bar" id="statsBar"></div>
  <div class="tabs-row" id="filterTabs"></div>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      جاري التحميل...
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ncrycgbrstafdouvipzc.supabase.co";
const SUPABASE_KEY = "sb_publishable_6t2dkU27Rkinsoo8MhYAEQ_FSgj4G73";

let allPlayers = [];
let allEvents = [];
let allMatches = [];
let currentFilter = "all";

// ===== دالة آمنة للجلب =====
async function fetchSafe(table, query = "") {
  try {
    const url = `${SUPABASE_URL}/rest/v1/${table}${query ? "?" + query : ""}`;
    const res = await fetch(url, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    });
    if (!res.ok) {
      console.error(`خطأ في ${table}: ${res.status}`);
      return [];
    }
    const data = await res.json();
    // نضمنو إنو array
    if (!Array.isArray(data)) {
      console.error(`${table} ماشي array:`, data);
      return [];
    }
    return data;
  } catch (e) {
    console.error(`فشل ${table}:`, e);
    return [];
  }
}

function calcOverall(p) {
  return Math.round((p.strength + p.shot_power + p.pace + p.dribbling + p.passing + p.defense) / 6);
}

function statColor(v) {
  if (v >= 85) return "#22c55e";
  if (v >= 70) return "#84cc16";
  if (v >= 55) return "#eab308";
  if (v >= 40) return "#f97316";
  return "#dc2626";
}

function defaultPhoto() {
  return 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23dcfce7"><circle cx="12" cy="8" r="4"/><path d="M4 22c0-4 4-7 8-7s8 3 8 7" fill="none" stroke="%2316a34a" stroke-width="1.5"/></svg>';
}

function escapeHTML(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

// حساب إحصائيات اللاعب من الأحداث
function calcPlayerStats(playerId) {
  const ev = allEvents.filter(e => e.player_id === playerId);
  const goals = ev.filter(e => e.event_type === "goal").length;
  const assists = ev.filter(e => e.event_type === "assist").length;
  const motm = ev.filter(e => e.event_type === "motm").length;
  const yellow = ev.filter(e => e.event_type === "yellow").length;
  const red = ev.filter(e => e.event_type === "red").length;
  const ratings = ev.filter(e => e.event_type === "rating").map(e => e.rating);
  const avgRating = ratings.length > 0 ? (ratings.reduce((a,b)=>a+b,0) / ratings.length) : 0;
  const points = goals * 3 + assists * 2 + motm * 5 - yellow - red * 3;
  return { goals, assists, motm, yellow, red, points, avgRating, ratingsCount: ratings.length };
}

// ===== Load =====
async function loadAll() {
  try {
    const [players, events, matches] = await Promise.all([
      fetchSafe("players", "select=*&order=created_at.desc"),
      fetchSafe("events", "select=*"),
      fetchSafe("matches", "select=id")
    ]);

    allPlayers = players;
    allEvents = events;
    allMatches = matches;

    renderStatsBar();
    renderFilterTabs();
    renderPlayers();
  } catch (e) {
    document.getElementById("content").innerHTML = `<div class="loading">خطأ في التحميل: ${e.message}</div>`;
  }
}

// ===== Stats Bar =====
function renderStatsBar() {
  const totalPlayers = allPlayers.length;
  const totalMatches = allMatches.length;
  const totalGoals = allEvents.filter(e => e.event_type === "goal").length;
  const totalAssists = allEvents.filter(e => e.event_type === "assist").length;

  document.getElementById("statsBar").innerHTML = `
    <div class="stat-mini">
      <div class="stat-mini-icon g">
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div class="stat-mini-info">
        <div class="stat-mini-num">${totalPlayers}</div>
        <div class="stat-mini-lbl">لاعبين</div>
      </div>
    </div>
    <div class="stat-mini">
      <div class="stat-mini-icon b">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0 0 20M2 12h20"/></svg>
      </div>
      <div class="stat-mini-info">
        <div class="stat-mini-num">${totalMatches}</div>
        <div class="stat-mini-lbl">ماتشات</div>
      </div>
    </div>
    <div class="stat-mini">
      <div class="stat-mini-icon y">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0 0 20M2 12h20"/></svg>
      </div>
      <div class="stat-mini-info">
        <div class="stat-mini-num">${totalGoals}</div>
        <div class="stat-mini-lbl">أهداف</div>
      </div>
    </div>
    <div class="stat-mini">
      <div class="stat-mini-icon r">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      </div>
      <div class="stat-mini-info">
        <div class="stat-mini-num">${totalAssists}</div>
        <div class="stat-mini-lbl">تمريرات</div>
      </div>
    </div>
  `;
}

// ===== Filter Tabs =====
function renderFilterTabs() {
  const filters = [
    { key: "all", label: "الكل" },
    { key: "حارس", label: "حراس" },
    { key: "مدافع", label: "مدافعين" },
    { key: "وسط", label: "وسط" },
    { key: "مهاجم", label: "مهاجمين" },
    { key: "top", label: "🏆 الأفضل" }
  ];

  document.getElementById("filterTabs").innerHTML = filters.map(f => `
    <button class="tab ${f.key === currentFilter ? 'active' : ''}" onclick="setFilter('${f.key}')">${f.label}</button>
  `).join("");
}

window.setFilter = function(key) {
  currentFilter = key;
  renderFilterTabs();
  renderPlayers();
};

// ===== Render Players =====
function renderPlayers() {
  const content = document.getElementById("content");

  if (allPlayers.length === 0) {
    content.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2a10 10 0 0 0 0 20M2 12h20"/>
        </svg>
        <h2>مازال ما فيه لاعبين</h2>
        <p>الأدمن يزيد اللاعبين من اللوحة</p>
      </div>`;
    return;
  }

  let filtered = [...allPlayers];

  if (currentFilter === "top") {
    filtered.sort((a, b) => calcPlayerStats(b.id).points - calcPlayerStats(a.id).points);
  } else if (currentFilter !== "all") {
    filtered = filtered.filter(p => p.position === currentFilter);
    filtered.sort((a, b) => calcOverall(b) - calcOverall(a));
  } else {
    filtered.sort((a, b) => calcOverall(b) - calcOverall(a));
  }

  content.innerHTML = `<div class="players-grid">${filtered.map(cardHTML).join("")}</div>`;
}

function cardHTML(p) {
  const overall = calcOverall(p);
  const stats = calcPlayerStats(p.id);
  const photo = p.photo || defaultPhoto();

  return `
    <a href="player.html?id=${p.id}" class="player-card">
      ${stats.points > 0 ? `
        <div class="points-badge">
          <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          ${stats.points}
        </div>
      ` : ''}
      <div class="player-card-top">
        <div class="player-photo-wrap">
          <img class="player-photo" src="${photo}" alt="${escapeHTML(p.name)}" onerror="this.src='${defaultPhoto()}'" />
        </div>
        <div class="player-info">
          <div class="player-name">${escapeHTML(p.name)}</div>
          <span class="badge badge-${p.position}">${p.position}</span>
        </div>
        <div class="overall-circle" style="--ring-color:${statColor(overall)};color:${statColor(overall)}">${overall}</div>
      </div>
      <div class="stats-mini">
        <div class="stat-mini-item">
          <div class="stat-mini-val">${stats.goals}</div>
          <div class="stat-mini-lbl2">أهداف</div>
        </div>
        <div class="stat-mini-item">
          <div class="stat-mini-val">${stats.assists}</div>
          <div class="stat-mini-lbl2">تمريرات</div>
        </div>
        <div class="stat-mini-item">
          <div class="stat-mini-val">${stats.ratingsCount > 0 ? stats.avgRating.toFixed(1) : '-'}</div>
          <div class="stat-mini-lbl2">تقييم</div>
        </div>
      </div>
    </a>
  `;
}

loadAll();
</script>
</body>
</html>
