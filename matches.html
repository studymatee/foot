<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>الماتشات ⚽</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green: #16a34a; --green-bright: #22c55e; --green-deep: #15803d; --green-light: #dcfce7;
  --red: #dc2626; --red-bright: #ef4444; --red-light: #fee2e2;
  --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0;
}
body {
  font-family: 'Cairo', system-ui, sans-serif; color: var(--text);
  background: var(--bg); min-height: 100vh; padding: 20px; direction: rtl;
  position: relative; overflow-x: hidden;
}
body::before, body::after {
  content: ""; position: fixed; border-radius: 50%;
  filter: blur(120px); z-index: 0; pointer-events: none;
}
body::before {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(34,197,94,0.25), transparent 70%);
  top: -150px; right: -150px;
}
body::after {
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(239,68,68,0.18), transparent 70%);
  bottom: -200px; left: -200px;
}
.grid-bg {
  position: fixed; inset: 0;
  background-image: linear-gradient(rgba(22,163,74,0.06) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(22,163,74,0.06) 1px, transparent 1px);
  background-size: 45px 45px; z-index: 0; pointer-events: none;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
}
.container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }

.header {
  background: rgba(255,255,255,0.85);
  border: 1px solid var(--border);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 24px; padding: 18px 22px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px; flex-wrap: wrap; gap: 14px;
  box-shadow: 0 10px 40px rgba(15,23,42,0.08);
}
.logo { display: flex; align-items: center; gap: 14px; }
.logo-icon {
  width: 52px; height: 52px; border-radius: 16px;
  background: linear-gradient(135deg, var(--green-bright), var(--green-deep));
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px rgba(22,163,74,0.4);
}
.logo-icon svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.logo-text h1 {
  font-size: 1.3rem; font-weight: 900;
  background: linear-gradient(135deg, var(--green), var(--green-deep));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.logo-text p { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }

.nav-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 18px; border-radius: 14px; font-weight: 700; font-size: 0.85rem;
  cursor: pointer; border: none; transition: all 0.25s; text-decoration: none;
  font-family: inherit; white-space: nowrap;
}
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.btn-white { background: #fff; color: var(--green-deep); box-shadow: 0 4px 12px rgba(15,23,42,0.08); border: 1px solid var(--border); }
.btn-white:hover { transform: translateY(-2px); background: var(--green-light); }
.btn-green { background: linear-gradient(135deg, var(--green-bright), var(--green-deep)); color: #fff; box-shadow: 0 4px 12px rgba(22,163,74,0.35); }
.btn-green:hover { transform: translateY(-2px); }

.matches-list { display: flex; flex-direction: column; gap: 16px; }

.match-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 24px; padding: 24px;
  box-shadow: 0 8px 32px rgba(15,23,42,0.06);
  transition: all 0.3s;
  position: relative; overflow: hidden;
}
.match-card::before {
  content: ""; position: absolute; top: 0; right: 0; left: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--green), #fff, var(--red));
}
.match-card:hover { transform: translateY(-4px); box-shadow: 0 20px 50px rgba(15,23,42,0.12); }

.match-date {
  text-align: center;
  font-size: 0.8rem;
  color: var(--text-muted);
  font-weight: 700;
  margin-bottom: 16px;
}

.match-teams {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 20px;
  align-items: center;
}

.team {
  text-align: center;
}
.team-name {
  font-size: 1.1rem;
  font-weight: 900;
  color: var(--text);
  padding: 12px;
  background: var(--green-light);
  border-radius: 16px;
}
.team.team-b .team-name { background: var(--red-light); }

.score {
  font-size: 2rem;
  font-weight: 900;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 20px;
  background: #f1f5f9;
  border-radius: 16px;
  min-width: 100px;
  justify-content: center;
}
.score-win { color: var(--green-deep); }
.score-lose { color: var(--red); }

.match-motm {
  margin-top: 16px;
  padding: 12px 16px;
  background: linear-gradient(135deg, #fffbeb, #fef3c7);
  border: 1px solid #fbbf24;
  border-radius: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 0.85rem;
  font-weight: 700;
  color: #92400e;
}
.match-motm img {
  width: 40px; height: 40px; border-radius: 12px;
  border: 2px solid #fbbf24;
  object-fit: cover;
}

.empty {
  text-align: center;
  padding: 70px 20px;
  background: var(--card);
  border-radius: 28px;
  border: 2px dashed var(--border);
}
.empty svg {
  width: 72px; height: 72px;
  stroke: var(--green);
  fill: none; stroke-width: 1.5;
  margin-bottom: 20px;
}
.empty h2 { font-size: 1.3rem; margin-bottom: 10px; color: var(--text); }
.empty p { color: var(--text-muted); font-weight: 600; }

.loading { text-align: center; padding: 60px 20px; color: var(--text-muted); font-weight: 600; }
.spinner {
  width: 44px; height: 44px; border-radius: 50%;
  border: 4px solid rgba(22,163,74,0.2);
  border-top-color: var(--green);
  animation: spin 0.8s linear infinite; margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 600px) {
  .match-teams { grid-template-columns: 1fr; gap: 12px; }
  .score { font-size: 1.5rem; min-width: 80px; margin: 0 auto; }
  .header { padding: 14px 16px; }
  .logo-text h1 { font-size: 1.1rem; }
}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="container">
  <header class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0 0 20M2 12h20"/></svg>
      </div>
      <div class="logo-text">
        <h1>الماتشات</h1>
        <p>نتائج ماتشات الحومة 🇩🇿</p>
      </div>
    </div>
    <div class="nav-buttons">
      <a href="index.html" class="btn btn-white">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        الرئيسية
      </a>
      <a href="leaderboard.html" class="btn btn-white">
        <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        الترتيب
      </a>
    </div>
  </header>

  <div id="content">
    <div class="loading"><div class="spinner"></div>جاري التحميل...</div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase = createClient(
  'https://ncrycgbrstafdouvipzc.supabase.co',
  'sb_publishable_6t2dkU27Rkinsoo8MhYAEQ_FSgj4G73'
);

function formatDate(iso) {
  const d = new Date(iso);
  const days = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
  const months = ["جانفي", "فيفري", "مارس", "أفريل", "ماي", "جوان", "جويلية", "أوت", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function defaultPhoto() {
  return 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23dcfce7"><circle cx="12" cy="8" r="4"/><path d="M4 22c0-4 4-7 8-7s8 3 8 7"/></svg>';
}

async function load() {
  const content = document.getElementById("content");
  const { data, error } = await supabase.from("matches").select("*").order("match_date", { ascending: false });

  if (error) {
    content.innerHTML = `<div class="loading">خطأ: ${error.message}</div>`;
    return;
  }

  if (!data || data.length === 0) {
    content.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2a10 10 0 0 0 0 20M2 12h20"/>
        </svg>
        <h2>مازال ما فيه ماتشات</h2>
        <p>الأدمن يقدر يزيد الماتشات من اللوحة</p>
      </div>`;
    return;
  }

  // نجيبو معلومات MVP
  const motmIds = data.filter(m => m.motm_id).map(m => m.motm_id);
  let playersMap = {};
  if (motmIds.length > 0) {
    const { data: players } = await supabase.from("players").select("id,name,photo").in("id", motmIds);
    (players || []).forEach(p => playersMap[p.id] = p);
  }

  content.innerHTML = `<div class="matches-list">${data.map(m => {
    const motm = m.motm_id ? playersMap[m.motm_id] : null;
    const aWon = m.score_a > m.score_b;
    const bWon = m.score_b > m.score_a;
    return `<div class="match-card">
      <div class="match-date">📅 ${formatDate(m.match_date)}</div>
      <div class="match-teams">
        <div class="team">
          <div class="team-name">${m.team_a}</div>
        </div>
        <div class="score">
          <span class="${aWon ? 'score-win' : bWon ? 'score-lose' : ''}">${m.score_a}</span>
          <span style="color:#cbd5e1">-</span>
          <span class="${bWon ? 'score-win' : aWon ? 'score-lose' : ''}">${m.score_b}</span>
        </div>
        <div class="team team-b">
          <div class="team-name">${m.team_b}</div>
        </div>
      </div>
      ${motm ? `<div class="match-motm">
        ⭐ رجل الماتش:
        <img src="${motm.photo || defaultPhoto()}" onerror="this.src='${defaultPhoto()}'" />
        <span>${motm.name}</span>
      </div>` : ''}
      ${m.notes ? `<div style="margin-top:12px;padding:12px;background:#f8fafc;border-radius:12px;font-size:0.85rem;color:#64748b;font-weight:600">📝 ${m.notes}</div>` : ''}
    </div>`;
  }).join("")}</div>`;
}

load();
</script>
</body>
</html>
